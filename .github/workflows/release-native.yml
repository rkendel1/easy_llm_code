name: Native release artifacts
on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version
        required: true
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
          - os: macos-15-intel
          - os: ubuntu-24.04
          - os: ubuntu-24.04-arm
          - os: windows-2025
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run build
      - name: Run agent certification without cross-file resource contention
        run: npm test -w @easy-llm/code-agent -- --maxWorkers=1 --minWorkers=1
      - run: npm test -w @easy-llm/code-website
      - name: Build self-contained runtime
        shell: bash
        run: npm run build:native
      - uses: actions/upload-artifact@v4
        with:
          name: native-${{ runner.os }}-${{ runner.arch }}
          path: release/*
  release:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/download-artifact@v4
        with:
          pattern: native-*
          path: release
          merge-multiple: true
      - name: Generate checksums, updater manifest, and Homebrew cask
        env:
          RELEASE_VERSION: ${{ github.ref_type == 'tag' && github.ref_name || inputs.version }}
        run: |
          case "$RELEASE_VERSION" in v*) RELEASE_TAG="$RELEASE_VERSION" ;; *) RELEASE_TAG="v$RELEASE_VERSION" ;; esac
          node distribution/generate-release-metadata.mjs release "$RELEASE_TAG" "https://github.com/${{ github.repository }}/releases/download/$RELEASE_TAG"
      - run: cp distribution/install.sh distribution/install.ps1 distribution/uninstall.sh distribution/uninstall.ps1 release/
      - name: Publish release atomically after all targets pass
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || format('v{0}', inputs.version) }}
        run: gh release create "$RELEASE_TAG" release/* --generate-notes
